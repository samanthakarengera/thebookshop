<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boekdetails - The Bookshop</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>The Bookshop</h1>
        <nav class="navbar">
            <a href="books.html">Welkom</a>
            <a href="books.html">Catalogus</a>
            <a href="reservations.html">Mijn Reservaties</a>
            <a href="profile.html">Mijn profiel</a>
            <a href="login.html">Log uit</a>
        </nav>
    </header>

    <main>
        <a href="books.html">← Terug naar de boeken</a>

        <section id="bookDetails">
            <p>Boekgegevens laden...</p>
        </section>

        <section class="reviews-section">
            <h2>Reviews</h2>
            <p id="averageScore"></p>
            <div id="reviewList"></div>

            <div id="reviewFormSection" hidden>
                <h3>Schrijf een review</h3>
                <form id="reviewForm">
                    <label for="score">Score</label>
                    <select id="score" required>
                        <option value="">Kies een score</option>
                        <option value="5">5 - Uitstekend</option>
                        <option value="4">4 - Goed</option>
                        <option value="3">3 - Gemiddeld</option>
                        <option value="2">2 - Matig</option>
                        <option value="1">1 - Slecht</option>
                    </select>

                    <label for="reviewText">Je review</label>
                    <textarea id="reviewText" rows="4" maxlength="1000" required></textarea>

                    <button type="submit">Plaats review</button>
                </form>
            </div>

            <p id="reviewMessage"></p>
        </section>
    </main>

    <footer>The safe space voor boekwormen :)</footer>

    <script src="book-detail.js"></script>
</body>
</html>
