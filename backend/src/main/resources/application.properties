spring.application.name=thebookshop
server.port=8080

# H2 database instellen
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:thebookshop
# spring.datasource.url=jdbc:h2:file:./data/thebookshop
# spring.datasource.url=jdbc:h2:file:C:/Users/karen/Documents/Applications Architecture/thebookshop/data/thebookshop
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Tabellen automatisch aanmaken en bijwerken
spring.jpa.hibernate.ddl-auto=update

# SQL-instructies tonen in de console
spring.jpa.show-sql=true

# H2 databaseconsole activeren
spring.h2.console.enabled=true

# zo zie ik mijn foutmeldingen
server.error.include-message=always