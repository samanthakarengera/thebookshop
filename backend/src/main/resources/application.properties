spring.application.name=thebookshop
server.port=8080

# H2 database instellen
spring.datasource.url=jdbc:h2:file:./data/thebookshop
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Tabellen automatisch aanmaken en bijwerken
spring.jpa.hibernate.ddl-auto=update

# SQL-instructies tonen in de console
spring.jpa.show-sql=true

# H2 databaseconsole activeren
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
